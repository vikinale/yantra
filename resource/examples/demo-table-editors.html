<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Yantra Table — EditorFactory Demo</title>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial; background:#f6f7f9; padding:20px; }
    .card { background:#fff; padding:18px; border-radius:10px; box-shadow:0 6px 18px rgba(0,0,0,0.06); max-width:1100px; margin:auto; }
    h1 { font-size:18px; margin:0 0 12px 0; }
    .small { padding:6px 8px; border-radius:6px; background:#f3f4f6; border:0; cursor:pointer; }
    .note { font-size:13px; color:#555; margin-top:8px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Yantra Table — column-level editorFactory demo</h1>
    <div style="display:flex;gap:8px;margin-bottom:12px;align-items:center">
      <button id="btnReset" class="small">Reset data</button>
      <button id="btnStartId3" class="small">Edit row id=3 (programmatic)</button>
      <div style="flex:1"></div>
      <span style="color:#1976d2;font-weight:600" id="info"></span>
    </div>

    <div id="table"></div>

    <p class="note">
      Demo: <strong>name</strong> uses text editor, <strong>amount</strong> uses number editor, <strong>status</strong> uses
      static select, <strong>category</strong> uses async select (simulated), <strong>color</strong> uses a custom color picker factory.
      Inline editing is enabled; ID & Created columns are non-editable.
    </p>
  </div>

  <!-- Load yantra core + table module (update paths if needed) -->
  <script src="../js/yantra.js"></script>
  <script src="../js/yantra.table.js"></script>

  <script>
  // sample dataset
  const initialData = [
    { id:1, name:'Alice', status:'active', amount:120, category:'cat-1', color:'#ff4444', created:'2025-01-10' },
    { id:2, name:'Bob', status:'inactive', amount:75,  category:'cat-2', color:'#44cc88', created:'2025-02-11' },
    { id:3, name:'Charlie', status:'active', amount:560, category:'cat-3', color:'#4422ff', created:'2025-02-18' },
    { id:4, name:'David', status:'active', amount:40,  category:'cat-2', color:'#ffaa00', created:'2025-03-01' },
    { id:5, name:'Evelyn', status:'inactive', amount:200,category:'cat-1', color:'#00aaff', created:'2025-03-10' }
  ];
  let data = initialData.slice();

  // register a custom editor factory: 'color' -> color input
  if (yantra && typeof yantra.registerEditorFactory === 'function') {
    yantra.registerEditorFactory('color', (row, col, opts) => {
        // wrapper
        const wrap = document.createElement('div');
        wrap.style.display = 'flex';
        wrap.style.alignItems = 'center';
        wrap.style.gap = '6px';

        // Color input
        const color = document.createElement('input');
        color.type = 'color';
        color.style.width = '40px';
        color.style.height = '28px';
        color.style.border = 'none';
        color.style.padding = '0';
        color.style.cursor = 'pointer';

        // Text HEX input
        const text = document.createElement('input');
        text.type = 'text';
        text.className = 'inline-input';
        text.style.width = '90px';

        // initial value
        const initial = row[col.key] || '#000000';
        color.value = initial;
        text.value = initial;

        // sync: picker -> text
        color.addEventListener('input', () => {
            text.value = color.value;
        });

        // sync: text -> picker
        text.addEventListener('input', () => {
            const v = text.value.trim();
            if (/^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.test(v)) {
            color.value = v;
            }
        });

        wrap.appendChild(color);
        wrap.appendChild(text);

        // ---- IMPORTANT ----
        // Provide read / write methods directly on wrapper
        wrap.read = () => text.value;
        wrap.write = (v) => {
            v = v || '#000000';
            color.value = v;
            text.value = v;
        };

        return wrap;
        });

  }

  // create columns demonstrating various editorFactory styles
  const columns = [
    { key:'id', label:'ID', sortable:true, editable:false },                  // non-editable
    { key:'name', label:'Name', sortable:true, editorFactory:'text' },        // built-in text
    { key:'status', label:'Status', sortable:true,
      // static select via object factory spec
      editorFactory: { type:'select', options: [ {value:'',label:'--'}, {value:'active',label:'Active'}, {value:'inactive',label:'Inactive'} ], placeholder:'--' }
    },
    { key:'amount', label:'Amount', sortable:true, editorFactory:'number' },  // built-in number
    { key:'category', label:'Category', sortable:true,
      // async select: options fetched via a Promise (simulated)
      editorFactory: { type:'select', options: (row, col) => {
        // simulate fetch with Promise + setTimeout
        return new Promise(resolve => {
          setTimeout(() => {
            resolve([
              { value:'cat-1', label:'Category 1' },
              { value:'cat-2', label:'Category 2' },
              { value:'cat-3', label:'Category 3' },
              { value:'cat-4', label:'Category 4' }
            ]);
          }, 300); // small delay to demonstrate async
        });
      }, placeholder:'-- choose --' }
    },
    { key:'color', label:'Color', sortable:false, editorFactory:'color' },   // custom factory registered above
    { key:'created', label:'Created', sortable:true, editable:false }        // non-editable
  ];

  // create table: inline edit enabled & validationMap shown
  const table = yantra.createTable('#table', {
    columns,
    data,
    pageSize: 5,
    inlineEdit: true,
    inlineEditAutoActions: true,
    validationMap: {
      name: ['required','minLength:2'],
      status: ['required'],
      amount: ['required','number','min:0'],
      category: ['required']
    }
  });

  // simple UI wiring
  function updateInfo() {
    const total = table.state && table.state.total ? table.state.total : data.length;
    document.getElementById('info').textContent = `Rows: ${total}`;
  }
  table.on('refresh', ({state}) => updateInfo());
  table.on('editStart', p => console.log('editStart', p));
  table.on('editSave', p => console.log('editSave', p));
  table.on('editCancel', p => console.log('editCancel', p));
  updateInfo();

  // Reset button
  document.getElementById('btnReset').addEventListener('click', () => {
    data = initialData.slice();
    table.setData(data);
    yantra.toast('Data reset');
  });

  // programmatic start edit row id=3
  document.getElementById('btnStartId3').addEventListener('click', () => {
    table.startInlineEditById(3);
  });
  </script>
</body>
</html>
